<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시작 페이지 (시안)</title>
<!-- 시작 페이지 시안(임시). 게임사 홈페이지식 첫 화면:
     왼쪽 = 이름·소개·[프로젝트] 버튼, 오른쪽 = 프로젝트 cover를 시간에 따라 넘겨 보여 주는 대표 이미지 + 아래 네비게이션.
     전체 배경 = 지금 보이는 프로젝트의 cover를 반투명 막 아래에 깔고, 넘어갈 때 페이드 인·아웃.
     내용은 data/*.json에서만 읽고, 색은 theme/theme.css(넷마블 테마)를 따릅니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="assets/nm/netmarble-mode.js?v=20261123"></script><script>NM.apply()</script>
<link rel="stylesheet" href="theme/theme.css?v=20261123">
<style>
:root{
  --bg: var(--t-bg, #fff);
  --page: var(--t-surface, #f7f5f2);
  --card: var(--t-card, #fff);
  --ink: var(--t-ink, #3d2518);
  --body: var(--t-body, #514a46);
  --muted: var(--t-muted, #756b65);
  --line: var(--t-line, #e7e2dd);
  --line-2: var(--t-line-2, #c8c1bb);
  --accent: var(--t-accent, #5c3722);
  --accent-fill: var(--t-accent, #5c3722);
  --dot: var(--t-accent-2, #ffc928);
  --r: var(--t-radius, 20px);
  --shadow: var(--t-shadow, rgb(61 37 24/.14));
  --band: var(--page);                 /* 페이지 바탕 띠 색 — 그림 없는 절(프로필)은 이 색 그대로, 그림 있는 절은 이 색의 반투명 막 */
  --veil: color-mix(in srgb, var(--band) 80%, transparent);   /* cover 위 반투명 막 = 띠 색 80% → 그림이 빠져도 같은 색으로 이어짐 */
  --slide-ms: 6000;                    /* 한 프로젝트를 보여 주는 시간(ms) — 스크립트가 읽음 */
  color-scheme: light;
}
:root[data-theme="dark"]{--accent:#D9A574;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--band)}
body{margin:0;background:transparent;   /* 바탕색은 html에만 — body에 칠하면 뒤에 붙은 장면 배경(.scene-bg)을 덮어 버림 */
color:var(--body);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}

/* 네비게이터 — 첫 화면 위에 투명하게 겹침 */
.nav{position:fixed;inset:0 0 auto;z-index:30;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.solid{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:26px;height:60px;font-size:14px}
.nav .me{font-weight:700;color:var(--ink);margin-right:auto;font-size:15px}
.nav a.l{color:var(--body)}
.nav a.l:hover{color:var(--ink)}
.mode-btn{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink);border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;white-space:nowrap}
.mode-btn:hover{border-color:var(--accent)}

/* ── 장면 배경: 화면 전체에 붙어 있는 한 장(스크롤해도 움직이지 않음) ──
   cover를 흐리게 겹쳐 두고 지금 장면의 것만 opacity 1 → 장면이 바뀌면 페이드. 화면을 꽉 채우고 남는 부분은 잘림.
   위에 띠 색 반투명 막. 그림이 없는 장면(프로필)은 모든 그림이 꺼져 띠 색만 남음 */
.scene-bg{position:fixed;inset:0;z-index:-1;background:var(--band);overflow:hidden;pointer-events:none}
.scene-bg img{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;opacity:0;transition:opacity 1.2s ease;filter:blur(6px) saturate(1.05)}
.scene-bg img.on{opacity:1}
.scene-bg::after{content:"";position:absolute;inset:0;background:var(--veil)}

/* ── 장면(한 화면 = 한 절): 스크롤은 자유롭게(자동으로 끌어가지 않음), 장면에 들어오면 요소들이 차례로 올라옴 ── */
.snap{min-height:100vh;min-height:100svh}
[data-rv]{opacity:0;translate:0 48px}
.snap.act [data-rv]{animation:rv .85s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--d,0) * 90ms)}
@keyframes rv{from{opacity:0;translate:0 48px}to{opacity:1;translate:0 0}}

/* ── 첫 화면 ── */
.hero{display:flex;align-items:center}

.hero .grid{width:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center;padding-top:92px;padding-bottom:72px}

/* 왼쪽: 이름·소개·버튼 */
.intro .en{display:block;font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.intro h1{margin:0;font-size:clamp(52px,6.6vw,92px);font-weight:800;color:var(--ink);letter-spacing:-.04em;line-height:1}
.intro h1::after{content:"";display:block;width:64px;height:5px;margin-top:22px;border-radius:999px;background:linear-gradient(90deg,var(--accent-fill),var(--dot))}
.intro .hl,.intro .txt{word-break:keep-all}
.intro .hl{margin:24px 0 0;font-size:clamp(18px,1.7vw,22px);font-weight:700;line-height:1.45;color:var(--ink)}
.intro .txt{margin:12px 0 0;font-size:15.5px;line-height:1.75;color:var(--body);max-width:30em}
.cta{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px}
.cta a{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:700;border-radius:999px;padding:13px 24px;border:1.5px solid var(--line-2);color:var(--ink);background:color-mix(in srgb,var(--bg) 70%,transparent);transition:transform .2s,border-color .2s,box-shadow .2s}
.cta a:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 20px var(--shadow)}
.cta a.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
.cta a .ar{font-size:13px;opacity:.85}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:11px 20px;border-radius:999px;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 오른쪽: 대표 이미지 + 네비게이션 */
.show{display:flex;flex-direction:column;gap:16px}
.stage{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--page);box-shadow:0 24px 60px var(--shadow),0 0 0 1px color-mix(in srgb,var(--ink) 6%,transparent)}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.slide.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.slide img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.06);transition:transform 7s linear}
.slide.on img{transform:scale(1)}
.slide .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 26px 22px;background:linear-gradient(transparent,rgb(0 0 0/.72));color:#fff;display:flex;align-items:flex-end;gap:16px}
.slide .cap .t{flex:1;min-width:0}
.slide .cap .eb{font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--dot)}
.slide .cap h2{margin:4px 0 0;font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:clamp(24px,2.6vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.slide .cap p{margin:6px 0 0;font-size:14px;line-height:1.5;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .cap .go{flex:none;font-size:13px;font-weight:700;border-radius:999px;padding:9px 16px;background:var(--dot);color:#3D2518;white-space:nowrap}
.slide .cap .go:hover{filter:brightness(1.05)}

/* 아래 네비게이션: 화살표 + 프로젝트 탭(진행 막대) */
.snav{display:flex;align-items:stretch;gap:10px}
.snav .arr{all:unset;cursor:pointer;flex:none;width:44px;border-radius:14px;display:grid;place-items:center;font-size:18px;color:var(--ink);background:color-mix(in srgb,var(--card,#fff) 80%,transparent);border:1px solid var(--line)}
.snav .arr:hover{border-color:var(--accent)}
.tabs{flex:1;display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.tab{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:color-mix(in srgb,var(--card,#fff) 80%,transparent);border:1px solid var(--line);overflow:hidden;transition:border-color .2s,background .2s}
.tab:hover{border-color:var(--line-2)}
.tab .th{flex:none;width:64px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--page)}
.tab .th img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.6);opacity:.75;transition:filter .3s,opacity .3s}
.tab .nm{min-width:0;display:flex;flex-direction:column;gap:1px}
.tab .nm b{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .nm small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--accent-fill),var(--dot))}
.tab.on{border-color:var(--accent);background:var(--card,#fff)}
.tab.on .th img{filter:none;opacity:1}
.tab:focus-visible,.snav .arr:focus-visible,.cta a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.scroll-hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;gap:6px}
.scroll-hint::after{content:"";width:1.5px;height:26px;background:linear-gradient(var(--muted),transparent);animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(6px);opacity:1}}

/* ── 프로필 절: 단색 바탕(배경 그림 없음) · 왼쪽 큰 이름 + 연락처 / 오른쪽 소개·숫자·기술 스택 ── */
.profile{padding:88px 0 40px;display:flex;flex-direction:column;justify-content:center}   /* 그림 없는 장면: 배경 그림이 모두 꺼져 띠 색만 */
.profile .grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:72px;align-items:start}
.sec-eb{display:inline-flex;align-items:center;gap:10px;font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.sec-eb::before{content:"";width:28px;height:3px;border-radius:999px;background:linear-gradient(90deg,var(--accent-fill),var(--dot))}
.who h2{margin:22px 0 0;font-size:clamp(64px,8.4vw,128px);font-weight:800;color:var(--ink);letter-spacing:-.05em;line-height:.95}
.who .en{margin:16px 0 0;font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:clamp(17px,1.6vw,21px);font-weight:700;color:var(--muted);letter-spacing:.01em}
.contacts{margin:44px 0 0;padding:0;list-style:none;border-top:1px solid var(--line-2)}
.contacts li{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px 2px;border-bottom:1px solid var(--line-2)}
.contacts .k{font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.contacts .v{font-size:17px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contacts a.v:hover{color:var(--accent)}
.contacts .act{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;white-space:nowrap;background:var(--bg)}
.contacts .act:hover{border-color:var(--accent)}
.contacts .act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.about .hl{margin:0;font-size:clamp(24px,2.5vw,34px);font-weight:800;line-height:1.35;color:var(--ink);letter-spacing:-.03em;word-break:keep-all}
.about .txt{margin:18px 0 0;font-size:16.5px;line-height:1.8;color:var(--body);word-break:keep-all}
.stats{margin:44px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{background:var(--bg);border-radius:var(--r);padding:22px 22px 20px;box-shadow:0 0 0 1px var(--line)}
.stat b{display:block;font-family:var(--t-display,Poppins),Pretendard,sans-serif;font-size:clamp(36px,3.4vw,48px);font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.02em}
.stat b small{font-family:Pretendard,sans-serif;font-size:16px;font-weight:700;margin-left:4px;color:var(--body)}
.stat span{display:block;margin-top:10px;font-size:14px;font-weight:700;color:var(--ink)}
.stat em{display:block;margin-top:3px;font-style:normal;font-size:12.5px;line-height:1.5;color:var(--muted);word-break:keep-all}
/* 기술 스택: 이력 아래 전체 폭 블럭 줄(지금 포트폴리오와 같은 구조) + 누르면 아래로 펼치기 */
.skills{margin-top:64px}
.stack-h{margin:0 0 16px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stack-h h3{margin:0;font-size:21px;font-weight:800;color:var(--ink)}
.stack-h small{font-size:13px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.chip{all:unset;cursor:pointer;background:var(--bg);border-radius:var(--r);padding:18px 16px 16px;display:flex;flex-direction:column;gap:8px;min-height:116px;box-shadow:0 0 0 1px var(--line);transition:transform .25s,box-shadow .25s}
.chip:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--line),0 8px 24px var(--shadow)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip .n{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.chip .k{font-size:12px;color:var(--muted);line-height:1.45}
.chip .c{margin-top:auto;font-size:12px;font-weight:600;color:var(--accent)}
.chip[aria-expanded=true]{box-shadow:0 0 0 2px var(--accent)}
.chip[aria-expanded=true] .c::after{content:" 닫기"}
.chip[aria-expanded=false] .c::after{content:" 펼치기"}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.panel.open{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.panel .in{margin-top:14px;background:var(--bg);border-radius:var(--r);padding:24px 28px;box-shadow:0 0 0 1px var(--line)}
.panel h4{margin:0 0 14px;font-size:17px;color:var(--ink)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.panel li{display:flex;gap:12px;align-items:baseline;font-size:15px;line-height:1.6;color:var(--body)}
.panel li .p{flex:none;font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--accent);border:1px solid var(--line-2);border-radius:999px;padding:2px 9px}
.panel li .p:hover{border-color:var(--accent)}
.panel code{font-family:D2Coding,ui-monospace,monospace;font-size:.92em;background:var(--page);padding:0 .3em;border-radius:5px}

/* ── 프로젝트 절: 그림 배경(backdrop)을 다시 씀 ──
   배경 그림은 화면에 붙어 있고(sticky), 지금 화면 가운데에 있는 프로젝트의 cover로 페이드.
   위쪽은 띠 색에서 그림으로, 아래쪽은 다시 띠 색으로 녹아듦 */
/* 프로젝트 하나 = 한 화면. 배경은 그 프로젝트의 cover가 화면을 꽉 채움.
   한 화면(약 900px)에 들어가게: 대표 카드 그림을 21:9로 낮추고, 줄 제목과 겹치는 카드 속 제목·한 줄 소개는 빼고, 버튼을 한 줄로 */
.shelf .sec-eb{margin-bottom:12px}
.shelf h2{font-size:clamp(20px,2.2vw,26px)}
.shelf .card.lead .img{aspect-ratio:21/9}
.shelf .card.lead .tx{padding:16px 20px 18px;gap:7px}
.shelf .card dl.meta{margin-top:2px;gap:8px 16px}
.shelf .card .intent{margin:2px 0 0;padding:8px 12px}
.shelf .tags{margin-top:2px}
.shelf .btns{padding-top:8px;gap:6px}
.shelf .btns a{padding:6px 12px;font-size:12.5px}
/* 2×2 높이는 대표 카드가 정함(기능 카드가 높이를 늘리지 않게) — 기능 카드 그림은 2:1, 남는 칸에 글 */
@media (min-width:981px){.shelf .feat-grid{contain:size;grid-auto-rows:minmax(0,1fr)}}
.shelf .feat-grid .card.feat .img{aspect-ratio:2/1}

/* 프로젝트 한 덩어리 — 지금 포트폴리오(index.html)의 카드 구조 그대로:
   줄 제목("굵은 제목. 회색 부제.") + 왼쪽 대표 카드 + 오른쪽 기능 카드 2×2 */
.shelf{padding:76px 0 20px;display:flex;flex-direction:column;justify-content:center}
.shelf h2{margin:0 0 18px;font-size:clamp(22px,3vw,28px);font-weight:700;color:var(--ink);letter-spacing:-.02em;line-height:1.25;word-break:keep-all}
.shelf h2 span{color:var(--muted)}
.card{background:var(--card,#fff);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px var(--shadow);transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column}
.card:hover{transform:scale(1.012);box-shadow:0 10px 30px var(--shadow)}
.card .img{aspect-ratio:16/9;background:var(--page);overflow:hidden}
.card .img img{width:100%;height:100%;object-fit:cover;display:block}
.card .img.play{display:block;position:relative}
.card .img.play img{transition:transform .4s}
.card .img.play:hover img{transform:scale(1.03)}
.play-badge{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:10px;padding:7px 16px 7px 7px;border-radius:999px;background:var(--accent-fill);color:#fff;
  box-shadow:0 0 0 1.5px rgb(255 255 255/.9),0 8px 22px rgb(0 0 0/.35);transition:transform .25s,box-shadow .25s}
:root[data-theme="dark"] .play-badge{box-shadow:0 0 0 1.5px rgb(255 255 255/.75),0 8px 22px rgb(0 0 0/.5)}
.play-badge .pi{flex:none;width:30px;height:30px;border-radius:50%;background:var(--dot);color:var(--accent-fill);display:grid;place-items:center;font-size:12px;font-style:normal;padding-left:2px}
.play-badge .pt{display:flex;flex-direction:column;gap:1px}
.play-badge b{font-size:13.5px;font-weight:700;line-height:1.2}
.play-badge small{font-size:11px;opacity:.85;line-height:1.2}
.card .img.play:hover .play-badge{transform:translateY(-2px);box-shadow:0 0 0 2px var(--dot),0 12px 26px rgb(0 0 0/.4)}
.card .img.tbl{display:flex;align-items:center;justify-content:center;padding:14px 16px}
.card .img.tbl table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card,#fff);border-radius:12px;overflow:hidden;font-size:clamp(11px,.95vw,13.5px);line-height:1.35}
.card .img.tbl td:last-child{white-space:nowrap}
.card .img.tbl th{text-align:left;font-weight:700;color:var(--ink);padding:7px 10px;border-bottom:2px solid var(--accent);white-space:nowrap}
.card .img.tbl td{padding:7px 10px;color:var(--body);border-top:1px solid var(--line)}
.card .img.tbl td:nth-child(2){font-weight:700;color:var(--ink);white-space:nowrap}
.card .img.tbl td:first-child{color:var(--muted);text-align:center}
.card .img.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.card .tx{padding:20px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .eb{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.card h3{margin:0;font-size:20px;font-weight:700;color:var(--ink);line-height:1.3}
.card.lead h3{font-size:26px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--body)}
.card code{font-family:D2Coding,ui-monospace,monospace;font-size:.92em;background:var(--page);padding:0 .3em;border-radius:5px}
.card .intent{margin:4px 0 2px;padding:10px 14px;border-left:3px solid var(--dot);background:var(--page);border-radius:0 12px 12px 0}
.card .intent .k{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--accent);margin-bottom:3px}
.card .intent p{font-size:13.5px;line-height:1.6;color:var(--body)}
.card dl.meta{margin:6px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;font-size:13px}
.card dl.meta .wide{grid-column:1/-1}
.card dt{color:var(--muted);font-size:11.5px;font-weight:600;margin-bottom:1px}
.card dd{margin:0;color:var(--ink);font-weight:600;line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:11.5px;color:var(--body);background:var(--page);border-radius:999px;padding:3px 10px}
.btns{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.btns a{font-size:13px;font-weight:600;border-radius:999px;padding:7px 15px;border:1px solid var(--line);color:var(--ink)}
.btns a.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff}
:root[data-theme="dark"] .btns a.pri{box-shadow:0 0 0 1px var(--line-2)}
.btns a:hover{border-color:var(--ink)}
.card .more{margin-top:auto;padding-top:8px;font-size:13px;font-weight:600;color:var(--accent)}
.proj{display:grid;grid-template-columns:min(460px,40%) minmax(0,1fr);gap:18px;align-items:stretch;padding:6px 0 0}
.feat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:18px}
.feat-grid .card.feat{min-height:0}
.feat-grid .card.feat .img{flex:none}
.feat-grid .card.feat .tx{padding:14px 18px 16px;gap:5px;min-height:0;overflow:hidden}
.feat-grid .card.feat h3{font-size:17px;line-height:1.3}
.feat-grid .card.feat p{font-size:13.5px;line-height:1.55;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.feat-grid .card.feat .more{padding-top:4px}
@media (max-width:980px){.proj{grid-template-columns:1fr}.feat-grid .card.feat{aspect-ratio:16/18}}
@media (max-width:560px){.feat-grid{grid-template-columns:1fr}.feat-grid .card.feat{aspect-ratio:auto}}

footer{padding:28px 0 48px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}
footer a{color:var(--accent)}

@media (max-width:1000px){
  .hero .grid{grid-template-columns:1fr;gap:36px;padding-top:96px}
  .scroll-hint{display:none}
  .profile .grid{grid-template-columns:1fr;gap:48px}
  .chips{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .nav .wrap{gap:14px}.nav a.l.hide-sm{display:none}
  .cta a{padding:11px 18px;font-size:14px}
  .tab .th{display:none}.tab{padding:10px 12px}
  .snav .arr{width:38px}
  .slide .cap{padding:44px 16px 14px}.slide .cap p{display:none}
  .profile{padding:72px 0 80px}
  .contacts li{grid-template-columns:64px minmax(0,1fr) auto;gap:10px}
  .contacts .v{font-size:15px}
  .stats{grid-template-columns:1fr}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel .in{padding:18px 18px}
  .panel li{flex-direction:column;gap:4px}
}
@media (prefers-reduced-motion:reduce){
  .scene-bg img,.slide,.slide img{transition:none!important}
  [data-rv]{opacity:1;translate:none}.snap.act [data-rv]{animation:none}
  .scroll-hint::after{animation:none}
}
</style>
</head>
<body>
<div class="scene-bg" id="scenebg" aria-hidden="true"></div>
<nav class="nav" id="nav"><div class="wrap" id="navin"></div></nav>
<main id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/strings.js"></script><!-- 문구 표(theme/strings.tsv) — 버튼 이름을 지금 포트폴리오와 같게 -->
<script src="assets/common.js"></script><!-- PF.inline · PF.teamLabel · PF.deckSceneFor(기능 → 슬라이드 장면) -->
<script>
(async () => {
  await PFStr.load('theme/strings.tsv');
  const T = k => esc(PFStr.t(k));
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const J = u => fetch(u, {cache:'no-store'}).then(r => r.json());
  const pf = await J('data/portfolio.json');
  const projects = (await Promise.all(pf.projects.map(id => J(`data/projects/${id}.json`)))).filter(p => p.cover);
  const P = pf.profile;
  document.title = `${P.name} · 포트폴리오`;
  const cover = p => `src/${p.id}/${p.cover}`;
  const brief = p => {
    const g = ((p.meta || []).find(m => m.label === '장르') || {}).value || '';
    return [g.replace(/\s*\(.*\)\s*$/, ''), p.team && p.team.size].filter(Boolean).join(' · ');
  };

  // 네비게이터
  const navin = document.getElementById('navin');
  navin.innerHTML = `<a class="me" href="#top">${esc(P.name)}</a><a class="l" href="#profile">프로필</a><a class="l" href="#projects">프로젝트</a>` +
    `<a class="l hide-sm" href="index.html">지금 포트폴리오</a>` +
    (P.github ? `<a class="l hide-sm" href="${esc(P.github)}" target="_blank" rel="noopener">GitHub</a>` : '');
  navin.appendChild(NM.button('mode-btn'));
  const nav = document.getElementById('nav');
  const solid = () => nav.classList.toggle('solid', scrollY > 40);
  addEventListener('scroll', solid, {passive:true}); solid();

  // ── 프로필 절: 이름·연락처(왼쪽) / 한 줄 소개·숫자로 보는 나·기술 스택(오른쪽). 값은 모두 data/에서 ──
  // 웹에서 플레이(Games/<프로젝트>/). 프로젝트 폴더 → 게임 페이지·용량 (index.html의 GAMES와 같음)
  const GAMES = {
    '01-TreeHouse': { href: 'Games/TreeHouse/', size: '약 110MB' },
    '02-WeGotOne': { href: 'Games/WeGotOne/', size: '약 55MB' },
    '03-MagiCard': { href: 'Games/MagiCard/', size: '약 30MB' },
  };
  // 메인 페이지 전용 이미지(프로젝트 문서의 그 기능 절에 그림이 없는 기능용) — index.html의 DRAFT_IMG와 같음
  const DRAFT_IMG = {
    '01-TreeHouse': { '귀환해야 확정되는 깃털': { src: 'assets/nm/images/return.gif', alt: '깃털을 줍고 귀환하면 확정되어 밤으로 넘어가고, 줍고 사망하면 깃털이 0인 채 낮으로 돌아오는 장면' } },
    '02-WeGotOne': { '호스트가 물리를 계산하는 구조': { src: 'assets/nm/images/network-crop.gif', alt: '두 클라이언트 화면에서 같은 플레이어가 함께 움직이는 장면' } },
    '03-MagiCard': {
      '시점과 역할로 나눈 카드 조합': { alt: '같은 시점에 발동하는 카드의 실행 순서: 반응 → 조향 → 효과', table: [
        ['순서', '역할', '카드 (기본 시점)'],
        ['1', '반응', '관통 · 반사 (충돌)'],
        ['2', '조향', '유도 (비행) · 전이 (충돌)'],
        ['3', '효과', '분열 (발사) · 폭발 (소멸)'],
      ] },
      '상한을 넘는 분열은 위력으로': { src: 'assets/nm/images/split-burst.png', alt: '분열한 카드가 화면을 가득 채우며 퍼지는 장면' },
    },
  };
  const ptitle = id => (projects.find(p => p.id === id) || {}).title || id;
  const profileHtml = () => {
    const solo = projects.filter(p => p.team && p.team.type === 'solo'), team = projects.filter(p => p.team && p.team.type === 'team');
    const contacts = [
      P.github && `<li><span class="k">GITHUB</span><a class="v" href="${esc(P.github)}" target="_blank" rel="noopener">${esc(P.github.replace(/^https?:\/\//, ''))}</a><a class="act" href="${esc(P.github)}" target="_blank" rel="noopener">열기 ↗</a></li>`,
      P.email && `<li><span class="k">EMAIL</span><a class="v" href="mailto:${esc(P.email)}">${esc(P.email)}</a><button class="act" type="button" data-copy="${esc(P.email)}">복사</button></li>`,
      ...(P.links || []).map(l => `<li><span class="k">${esc((l.label || 'LINK').toUpperCase())}</span><a class="v" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.url.replace(/^https?:\/\//, ''))}</a><a class="act" href="${esc(l.url)}" target="_blank" rel="noopener">열기 ↗</a></li>`),
    ].filter(Boolean).join('');
    // 기술 스택 블럭: 지금 포트폴리오(index.html)의 기술 스택 카드와 같은 구조 — 이름 · 키워드(없으면 근거 프로젝트) · 근거 개수
    const stack = pf.skills.map((s, i) => {
      const m = s.name.match(/^(.*?)\s*\((.*)\)\s*$/);
      const keys = m ? m[2] : [...new Set(s.evidence.map(e => ptitle(e.project)))].join(' · ');
      return `<button class="chip" type="button" aria-expanded="false" aria-controls="skpanel" data-i="${i}"><span class="n">${esc(m ? m[1] : s.name)}</span><span class="k">${esc(keys)}</span><span class="c">근거 ${s.evidence.length}개 ·</span></button>`;
    }).join('');
    return `<section class="profile snap" id="profile" data-bg="none"><div class="wrap grid">
      <div class="who">
        <span class="sec-eb" data-rv style="--d:0">PROFILE</span>
        <h2 data-rv style="--d:1">${esc(P.name)}</h2>
        <p class="en" data-rv style="--d:2">${esc(P.nameEn)}</p>
        <ul class="contacts" data-rv style="--d:3">${contacts}</ul>
      </div>
      <div class="about">
        <p class="hl" data-rv style="--d:1">${esc(P.headline)}</p>
        <p class="txt" data-rv style="--d:2">${esc(P.intro).replace(/\n/g, ' ')}</p>
        <div class="stats" data-rv style="--d:3">
          <div class="stat"><b>${projects.length}<small>개</small></b><span>진행한 프로젝트</span><em>${projects.map(p => esc(p.title)).join(' · ')}</em></div>
          <div class="stat"><b>${solo.length}<small>개인</small> ${team.length}<small>팀</small></b><span>개발 형태</span><em>${team.map(p => `${esc(p.title)} ${esc(p.team.size)} 팀`).join(' · ')}${team.length && solo.length ? ' · ' : ''}${solo.length ? '나머지는 1인 개발' : ''}</em></div>        </div>
      </div>
    </div>
    <div class="wrap skills" data-rv style="--d:4">
      <div class="stack-h"><h3>기술 스택</h3><small>눌러서 근거 프로젝트와 함께 펼쳐 보세요. 다시 누르면 닫힙니다.</small></div>
      <div class="chips">${stack}</div>
      <div class="panel" id="skpanel"><div><div class="in" id="skin"></div></div></div>
    </div></section>`;
  };

  // ── 프로젝트 한 덩어리: index.html과 같은 구조(줄 제목 + 대표 카드 + 기능 카드 2×2) ──
  const md = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
  const projectHtml = p => {
    const src = f => `src/${p.id}/${f}`;
    const metaDl = (p.meta || []).map(m => `<div><dt>${esc(m.label)}</dt><dd>${PF.inline(m.value)}</dd></div>`)
      .concat(p.team && p.team.role ? [`<div class="wide"><dt>${T('name.role')}</dt><dd>${PF.inline(p.team.role)}</dd></div>`] : []).join('');
    const deck = `project.html?p=${encodeURIComponent(p.id)}`, doc = `doc.html?p=${encodeURIComponent(p.id)}`;
    const game = GAMES[p.id];
    const coverImg = p.cover ? `<img src="${esc(src(p.cover))}" alt="${esc(p.title)} 대표 이미지" loading="lazy">` : '';
    const lead = `<article class="card lead" data-rv style="--d:2">
      ${!coverImg ? '' : game ? `<a class="img play" href="${esc(game.href)}" target="_blank" rel="noopener" aria-label="${esc(p.title)} 웹에서 바로 플레이 (새 탭)">${coverImg}<span class="play-badge"><i class="pi" aria-hidden="true">▶</i><span class="pt"><b>웹에서 바로 플레이</b><small>설치 없이 · ${esc(game.size)}</small></span></span></a>` : `<div class="img">${coverImg}</div>`}
      <div class="tx"><span class="eb">${esc(PF.teamLabel(p.team))}</span>
        ${metaDl ? `<dl class="meta">${metaDl}</dl>` : ''}
        ${p.intent && p.intent.text ? `<div class="intent"><span class="k">${T('name.intent')}</span><p>${PF.inline(p.intent.text)}</p></div>` : ''}
        <div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        <div class="btns"><a class="pri" href="${deck}">${T('name.deck')}</a><a href="${doc}">${T('name.doc')}</a>${p.links.github ? `<a href="${esc(p.links.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}${p.links.video ? `<a href="${esc(p.links.video)}" target="_blank" rel="noopener">${T('name.video')}</a>` : ''}${game ? `<a href="${esc(game.href)}" target="_blank" rel="noopener">▶ 웹에서 플레이</a>` : ''}</div>
      </div></article>`;
    const feats = (p.highlights || []).map((f, i) => {
      const d = f.image ? null : (DRAFT_IMG[p.id] || {})[f.title];
      const img = d && d.table ? `<div class="img tbl"><table aria-label="${esc(d.alt)}"><thead><tr>${d.table[0].map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${d.table.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
        : d ? `<div class="img"><img src="${esc(d.src)}" alt="${esc(d.alt)}" loading="lazy"></div>`
        : f.image ? `<div class="img"><img src="${esc(src(f.image.src))}" alt="${esc(f.image.caption || f.title)}" loading="lazy"></div>` : `<div class="img empty">이미지 준비 중</div>`;
      const sid = PF.deckSceneFor(p, f.section);   // 기능 카드 → 슬라이드에서 그 기능을 설명하는 장면
      return `<a class="card feat" data-rv style="--d:${3 + i}" href="${deck}${sid ? `#s=${sid}` : ''}">${img}
        <div class="tx"><span class="eb">기능 ${i + 1}</span><h3>${esc(f.title)}</h3><p>${md(f.what)}</p><span class="more">${T('page.see-in-deck')} ›</span></div></a>`;
    }).join('');
    const n = projects.indexOf(p);
    return `<section class="shelf snap" id="${esc(p.id)}" data-bg="${n}"><div class="wrap">
      <span class="sec-eb" data-rv style="--d:0">PROJECT ${String(n + 1).padStart(2, '0')}</span>
      <h2 data-rv style="--d:1">${esc(p.title)}. <span>${esc(p.tagline)}</span></h2>
      <div class="proj">${lead}<div class="feat-grid">${feats}</div></div></div></section>`;
  };


  document.getElementById('app').innerHTML = `
  <section class="hero snap" id="top" data-bg="carousel">
    <div class="wrap grid">
      <div class="intro">
        <span class="en" data-rv style="--d:0">${esc(P.nameEn)}</span>
        <h1 data-rv style="--d:1">${esc(P.name)}</h1>
        <p class="hl" data-rv style="--d:2">${esc(P.headline)}</p>
        <p class="txt" data-rv style="--d:3">${esc(P.intro)}</p>
        <div class="cta" data-rv style="--d:4">
          <a href="#projects">프로젝트 <span class="ar" aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="show" data-rv style="--d:2" role="region" aria-roledescription="carousel" aria-label="대표 프로젝트">
        <div class="stage" id="stage">${projects.map((p, i) => `
          <div class="slide" role="group" aria-roledescription="slide" aria-label="${i + 1} / ${projects.length}: ${esc(p.title)}">
            <img src="${esc(cover(p))}" alt="${esc(p.title)} 대표 이미지">
            <div class="cap"><div class="t"><span class="eb">PROJECT ${String(i + 1).padStart(2, '0')}</span><h2>${esc(p.title)}</h2><p>${esc(p.tagline)}</p></div>
              <a class="go" href="#${esc(p.id)}">자세히 보기</a></div>
          </div>`).join('')}
        </div>
        <div class="snav">
          <button class="arr" id="prev" aria-label="이전 프로젝트">‹</button>
          <div class="tabs" style="--n:${projects.length}">${projects.map((p, i) => `
            <button class="tab" data-i="${i}" aria-label="${esc(p.title)} 보기"><span class="th"><img src="${esc(cover(p))}" alt=""></span>
              <span class="nm"><b>${esc(p.title)}</b><small>${esc(brief(p))}</small></span><span class="bar"></span></button>`).join('')}
          </div>
          <button class="arr" id="next" aria-label="다음 프로젝트">›</button>
        </div>
      </div>
    </div>
    <span class="scroll-hint">SCROLL</span>
  </section>
  ${profileHtml()}
  <div id="projects">${projects.map(projectHtml).join('')}</div>`;
  // 장면 배경: 프로젝트 cover를 모두 미리 불러 둠(지연 로딩하면 보이지 않는 그림이 안 불려 첫 그림에 멈춤)
  document.getElementById('scenebg').innerHTML = projects.map(p => `<img src="${esc(cover(p))}" alt="" decoding="async">`).join('');
  document.getElementById('foot').innerHTML = `<span>${esc(P.name)} · ${esc(P.nameEn)}</span>${P.email ? `<a href="mailto:${esc(P.email)}">${esc(P.email)}</a>` : ''}${P.github ? `<a href="${esc(P.github)}" target="_blank" rel="noopener">GitHub</a>` : ''}<span>업데이트 ${esc(pf.generatedAt)}</span>`;

  // 알림(이메일 복사)
  const toast = document.getElementById('toast'); let tt;

  // ── 장면 전환: 화면 가운데 줄에 걸린 장면이 '지금 장면' ──
  //   지금 장면이 되면 .act → 요소들이 차례로 올라오고, 배경이 그 장면의 그림으로 페이드
  //   (첫 화면 = 넘겨 보여 주는 대표 이미지와 같은 그림 · 프로필 = 그림 없음 · 프로젝트 = 그 프로젝트 cover)
  //   장면이 화면에서 완전히 빠지면 .act를 떼어, 다시 들어올 때 또 올라오게
  const sceneImgs = [...document.querySelectorAll('#scenebg img')];
  const setBg = i => sceneImgs.forEach((b, k) => b.classList.toggle('on', k === i));
  const scenes = [...document.querySelectorAll('.snap')];
  let scene = scenes[0], heroIdx = 0;
  const bgFor = s => s.dataset.bg === 'carousel' ? heroIdx : s.dataset.bg === 'none' ? -1 : +s.dataset.bg;
  const enter = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    scene = e.target; scene.classList.add('act'); setBg(bgFor(scene));
  }), {rootMargin: '-50% 0px -50% 0px'});
  const leave = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) e.target.classList.remove('act'); }));
  scenes.forEach(s => { enter.observe(s); leave.observe(s); });

  // 기능 카드(2×2): 글 칸에 들어가는 만큼만 설명 줄 수를 정해, 줄 중간에서 잘리지 않고 마지막 줄 끝에 …가 붙게 (index.html과 같음)
  const fitFeat = () => document.querySelectorAll('.feat-grid .card.feat').forEach(c => {
    const tx = c.querySelector('.tx'), para = c.querySelector('p');
    if (!tx || !para) return;
    para.style.webkitLineClamp = 'unset'; para.style.display = 'block';
    const cs = getComputedStyle(tx), lh = parseFloat(getComputedStyle(para).lineHeight) || 21;
    const gap = parseFloat(cs.rowGap) || 0, others = [...tx.children].filter(x => x !== para);
    const room = tx.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
      - others.reduce((h, x) => h + x.offsetHeight, 0) - gap * others.length;
    para.style.display = ''; para.style.webkitLineClamp = String(Math.max(1, Math.floor(room / lh)));
  });
  fitFeat(); addEventListener('resize', fitFeat);

  // ── 기술 스택 펼치기: 블럭을 누르면 아래에 근거가 열리고, 같은 블럭을 다시 누르면 닫힘 ──
  //   열린 공간만큼 화면 아래가 잘리면 페이지를 그만큼 위로 올려서(스크롤) 펼친 내용이 한 화면에 들어오게.
  //   단, 블럭 줄이 머리 막대 밑으로 숨지 않을 만큼만 올리고, 닫을 때는 올린 만큼 되돌림
  const panel =document.getElementById('skpanel'), inner = document.getElementById('skin');
  const chips = [...document.querySelectorAll('.chip')], chipRow = document.querySelector('.chips');
  let open = -1, lifted = 0;
  const lift = () => {
    const navH = nav.offsetHeight, room = innerHeight - 24;
    const bottom = panel.getBoundingClientRect().top + inner.offsetHeight + 14;   // 다 펼쳤을 때 아래 끝
    const maxUp = chipRow.getBoundingClientRect().top - navH - 64;                // 블럭 줄 위 '스택 제목'까지는 보이게
    const d = Math.max(0, Math.min(bottom - room, maxUp));
    if (d > 1) { scrollBy({top: d, behavior: 'smooth'}); lifted += d; }
  };
  chips.forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    chips.forEach(x => x.setAttribute('aria-expanded', 'false'));
    if (open === i) {                                   // 다시 누름 → 닫고, 올렸던 만큼 내려 줌
      panel.classList.remove('open'); open = -1;
      if (lifted) { scrollBy({top: -lifted, behavior: 'smooth'}); lifted = 0; }
      return;
    }
    const s = pf.skills[i];
    inner.innerHTML = `<h4>${esc(s.name)}</h4><ul>` + s.evidence.map(e =>
      `<li><a class="p" href="#${esc(e.project)}">${esc(ptitle(e.project))}</a><span>${md(e.text)}</span></li>`).join('') + `</ul>`;
    b.setAttribute('aria-expanded', 'true'); panel.classList.add('open'); open = i;
    lift();
  }));

  // 이메일 복사
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); toast.textContent = '이메일을 복사했습니다.'; }
    catch { toast.textContent = b.dataset.copy; }
    toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1800);
  }));

  // ── 대표 이미지 넘기기: 대표 이미지·배경·탭이 같은 번호로 함께 바뀜 ──
  const slides = [...document.querySelectorAll('.slide')];
  const tabs = [...document.querySelectorAll('.tab')], n = slides.length;
  const DUR = +getComputedStyle(document.documentElement).getPropertyValue('--slide-ms') || 6000;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur = -1, t0 = 0, paused = false, raf = 0, left = DUR;
  const go = i => {
    i = (i + n) % n;
    slides.forEach((s, k) => s.classList.toggle('on', k === i));
    heroIdx = i; if (scene && scene.dataset.bg === 'carousel') setBg(i);   // 첫 화면에 있을 때만 배경도 같이 넘김
    tabs.forEach((b, k) => { b.classList.toggle('on', k === i); b.setAttribute('aria-current', k === i ? 'true' : 'false'); b.querySelector('.bar').style.width = '0'; });
    cur = i; left = DUR; t0 = performance.now();
  };
  const tick = now => {
    if (!paused && !reduce) {
      const el = DUR - left + (now - t0);
      tabs[cur].querySelector('.bar').style.width = Math.min(100, el / DUR * 100) + '%';
      if (el >= DUR) go(cur + 1);
    }
    raf = requestAnimationFrame(tick);
  };
  const pause = on => {
    if (on === paused) return;
    if (on) left -= performance.now() - t0; else t0 = performance.now();
    paused = on;
  };
  tabs.forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  const show = document.querySelector('.show');
  show.addEventListener('mouseenter', () => pause(true));
  show.addEventListener('mouseleave', () => pause(false));
  show.addEventListener('focusin', () => pause(true));
  show.addEventListener('focusout', () => pause(false));
  document.addEventListener('visibilitychange', () => pause(document.hidden));
  show.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(cur - 1); if (e.key === 'ArrowRight') go(cur + 1); });
  go(0); raf = requestAnimationFrame(tick);

  // 확인용: ?at=<번호> → 그 프로젝트부터
  const at = new URLSearchParams(location.search).get('at');
  if (at) go(+at);
})().catch(e => { document.getElementById('app').textContent = '데이터를 읽지 못했습니다: ' + e.message; });
</script>
</body>
</html>
